title: "[Q&A] "
body:
  - type: markdown
    attributes:
      value: |
        Welcome to **Yearning v4 Q&A**! Ask anything about using AI SQL Precheck, Database AI Assistant, approvals, `gh-ost`, rollback, read-only queries, or diagnostics.
        欢迎来到 **Yearning v4 使用问答区**！关于 AI 预审、数据库 AI 助手、审批流、在线改表、自动回滚、只读查询与性能诊断的任何使用疑问，都可以在此提问。

        > **Note / 提示**：
        > - 🚢 私有化部署、Nginx 反代、K8s 与 v3 升级问题建议发在 **[Self Hosting](https://github.com/cookieY/Yearning/discussions/new?category=self-hosting)**；
        > - 📖 提问前建议先查官方文档：https://v4.yearning.io （注：**Yearning v3 及更早版本已停止维护**）；
        > - 🐛 确认是可复现的 v4 程序 Bug 请提交 **[Bug Report](https://github.com/cookieY/Yearning/issues/new?template=1_bug_report.yml)**；发帖前请务必脱敏密码与密钥。

  - type: dropdown
    id: topic
    attributes:
      label: "🏷️ Question Topic / 问题分类"
      options:
        - "AI SQL Precheck, 48 Rules & Skills (AI 预审、内置规则与技能)"
        - "Database AI Assistant (数据库 AI 助手)"
        - "Flows, Approvals, Execution & gh-ost (流程、审批、执行与在线改表)"
        - "Automatic SQL Rollback (无 Binlog/WAL 自动回滚)"
        - "Query Workspace & Column Masking (只读查询与敏感脱敏)"
        - "SQL Performance Diagnostics (6 图 Top SQL 诊断)"
        - "LDAP / OIDC SSO & Permissions (认证与权限组)"
        - "OpenAPI & Agent Skill (/api/v4/* 集成)"
        - "Other / 其他"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "📌 Yearning v4 Version / 版本号"
      placeholder: "e.g. v4.0.0-rc.5 via Docker Compose"
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: "❓ Your Question / 问题描述"
      description: "Explain what you are trying to achieve, where you got stuck, and any relevant target database engine. / 请清晰说明你的目标、遇到的卡点以及涉及的数据库引擎。"
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: "🔍 What Have You Tried? / 已尝试的排查步骤"
      description: "Share docs pages read, sanitized config snippets, or error messages you already checked. / 可贴出查阅过的文档、脱敏配置片段或报错信息。"
    validations:
      required: false
