          type: string
        version:
          type: integer
          minimum: 1
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    KnowledgeEntryDefinitionWrite:
      type: object
      additionalProperties: false
      required:
      - knowledge_text
      - max_severity
      - version
      properties:
        knowledge_text:
          type: string
          minLength: 1
          maxLength: 65536
        max_severity:
          type: string
          enum: [info, low, medium]
          default: medium
          description: >-
            Advisory maximum severity for non-blocking internal experience
            guidance (info, low, or medium). Internal experience entries assist
            the Database AI Assistant and emit non-blocking advisory findings
            during AI Review without ever blocking submission.
        version:
          type: integer
          minimum: 1
    KnowledgeEntryDefinition:
      type: object
      additionalProperties: false
      required:
      - knowledge_text
      - max_severity
      - version
      properties:
        knowledge_text:
          type: string
          minLength: 1
          maxLength: 65536
        max_severity:
          type: string
          enum: [info, low, medium, high, critical]
          default: medium
          description: >-
            Stored advisory maximum severity for internal experience entries.
            Legacy high/critical values remain readable for historical rows and
            are capped at medium at runtime; new writes restrict max_severity
            to info, low, or medium.
        version:
          type: integer
          minimum: 1
    ReviewInputDefinition:
      type: object
      additionalProperties: false
      required:
      - knowledge_text
      - max_severity
      - version
      properties:
        knowledge_text:
          type: string
          minLength: 1
          maxLength: 65536
        max_severity:
          type: string
          enum: [info, low, medium, high, critical]
          default: medium
          description: >-
            Retained for v1 definition, API and stored-configuration
            compatibility. This field is not a submission ceiling for enabled
            mandatory rules and cannot authorize a lower-risk result: every
            actual hit from an enabled, frozen and scope-matched Prompt Tool
            rule becomes effective Critical and blocks submission regardless of
            the model-provided severity. Unbound model observations remain
            visible but are capped at Medium. The finding key is system-derived
            and is injected alongside the rule text.
        version:
          type: integer
          minimum: 1
    KnowledgeEntryEvaluation:
      type: object
      additionalProperties: false
      required:
