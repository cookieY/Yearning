            $ref: '#/components/schemas/ActorRef'
    FlowStageView:
      type: object
      description: >-
        Read-face projection of one flow stage with the resolved datasource
        catalog name (server-side join, RCP-20260904-FLOW-STAGE-DATASOURCE-NAME).
        The write face (FlowStageWrite) keeps the bare datasource_id; the name
        is a live join over the datasource catalog, never a persisted snapshot.
        The join always resolves while the catalog row exists, and flow stages
        block datasource deletion (logical-relations on_target_delete=block),
        so producers must never serialize an empty name; a temporarily missing
        catalog row falls back to the datasource_id value, which still satisfies
        minLength 1.
      additionalProperties: false
      required:
      - position
      - datasource_id
      - datasource_name
      - approval_steps
      - execution_actors
      properties:
        position:
          type: integer
          minimum: 1
        datasource_id:
          $ref: '#/components/schemas/Uuid'
        datasource_name:
          type: string
          minLength: 1
          maxLength: 128
        datasource_engine:
          type: string
          enum:
          - mysql
          - postgresql
          - tidb
          - oceanbase
          - polardb
        datasource_compatibility_mode:
          type: string
          enum:
          - mysql
          - postgresql
        datasource_database_name:
          type:
          - string
          - 'null'
          maxLength: 128
        approval_steps:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/ApprovalStepWrite'
        execution_actors:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ActorRef'
    QueryCapabilityWrite:
      type: object
      additionalProperties: false
      required:
      - datasource_id
      - can_query
      - can_export
      properties:
        datasource_id:
          $ref: '#/components/schemas/Uuid'
        can_query:
          type: boolean
          const: true
        can_export:
          type: boolean
    QueryCapabilityView:
      type: object
      additionalProperties: false
      description: Read projection of a flow's query capability with the
        resolved datasource name (server-side join against the datasource
        catalog; no staleness snapshot — renames and deletions propagate
        naturally, RCP-20260901-FLOW-CATALOG-DATASOURCE-NAMES). Write shapes
        keep QueryCapabilityWrite.
      required:
      - datasource_id
      - datasource_name
      - can_query
      - can_export
      properties:
        datasource_id:
          $ref: '#/components/schemas/Uuid'
        datasource_name:
          type: string
        can_query:
          type: boolean
          const: true
        can_export:
          type: boolean
    FlowWrite:
      type: object
      additionalProperties: false
      required:
      - name
      - flow_type
      - enabled
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        flow_type:
          $ref: '#/components/schemas/FlowType'
        enabled:
          type: boolean
        rule_set_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        stages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FlowStageWrite'
        approval_steps:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/ApprovalStepWrite'
        query_capabilities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QueryCapabilityWrite'
    Flow:
      type: object
      description: >-
        Flow read view. Read and write shapes are split: the read face
        re-declares stages as FlowStageView (each stage carries the resolved
        datasource_name) and query_capabilities as QueryCapabilityView (each
        capability carries the resolved datasource_name) while FlowWrite
        keeps FlowStageWrite and QueryCapabilityWrite for writes
        (RCP-20260904-FLOW-STAGE-DATASOURCE-NAME,
        RCP-20260901-FLOW-CATALOG-DATASOURCE-NAMES).
      additionalProperties: false
      required:
      - name
      - flow_type
      - enabled
      - id
      - version
      - status
      - created_at
      - updated_at
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        flow_type:
          $ref: '#/components/schemas/FlowType'
        enabled:
          type: boolean
        rule_set_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        stages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FlowStageView'
        approval_steps:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/ApprovalStepWrite'
        query_capabilities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QueryCapabilityView'
        id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - enabled
          - disabled
          - invalid
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
