          type: string
          enum:
          - oapi.dingtalk.com
    FeishuNotificationConfig:
      type: object
      additionalProperties: false
      description: >-
        Feishu custom bot channel (S007). The configuration surface carries no
        sensitive fields; the webhook (which embeds its token) and the optional
        signing secret are stored only inside the encrypted secret envelope.
    SlackNotificationConfig:
      type: object
      additionalProperties: false
      description: >-
        Slack Incoming Webhook channel (S007). The full webhook URL is the
        credential and is stored only inside the encrypted secret envelope;
        the configuration surface is intentionally empty.
