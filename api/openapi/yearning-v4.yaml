    CredentialWrite:
      type: object
      additionalProperties: false
      description: 'Explicit edit modes, exactly one per row: replace (username +
        password), reuse (username + reuse_credential_purpose pointing at a DIFFERENT
        purpose), or keep (reuse_credential_purpose equal to this row''s purpose;
        copies the stored full credential including username and is only legal when
        an enabled credential row for that purpose already exists on the datasource,
        therefore unavailable on create). Supplying password and reuse_credential_purpose
        together is rejected. Secrets are write-only and never echoed back.'
      required:
      - purpose
      properties:
        purpose:
          type: string
          enum:
          - review
          - query
          - execution
        username:
          type: string
          minLength: 1
          writeOnly: true
          description: Required for replace and reuse; must be absent for keep (the
            stored username is copied verbatim).
        password:
          oneOf:
          - $ref: '#/components/schemas/SecretInput'
          - type: 'null'
        reuse_credential_purpose:
          type:
          - string
          - 'null'
          enum:
          - review
          - query
          - execution
          - null
          description: 'Different purpose: reuse that purpose''s stored secret with
            the supplied username. Equal to this row''s purpose: keep mode (copy the
            stored full credential). Null when password is supplied.'
