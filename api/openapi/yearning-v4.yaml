    AiProviderWrite:
      type: object
      additionalProperties: false
      required:
      - name
      - provider_kind
      - base_url
      - model_name
      - enabled
      - selection_priority
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        provider_kind:
          type: string
          minLength: 1
          maxLength: 64
        base_url:
          type: string
          format: uri
        model_name:
          type: string
          minLength: 1
        enabled:
          type: boolean
        selection_priority:
          type: integer
          minimum: 1
          maximum: 100
        api_key:
          $ref: '#/components/schemas/SecretInput'
        configuration:
          allOf:
          - $ref: '#/components/schemas/AiProviderConfigurationWrite'
          description: >-
            Explicit full replacement of the user generation-parameter overrides
            (M2 semantics). Omitted preserves the stored configuration; an empty
            object is an explicit clear of all user overrides and triggers real
            change detection and probe re-negotiation. The system-managed
            structured_output_mode key is rejected here and only written by the
            server probe.
    AiProviderConfiguration:
      type: object
      additionalProperties: false
      description: >-
        Typed read-back of the stored provider configuration. Absent keys mean
        not configured (the request omits them; provider-side defaults apply and
        are never fabricated as values). structured_output_mode is the
        server-negotiated system key, read-only for clients.
      properties:
        reasoning_effort:
          type: string
          enum:
          - low
          - medium
          - high
        max_tokens:
          type: integer
          minimum: 256
          maximum: 200000
        context_window:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Optional model context window size in tokens (0 or omitted means unspecified). When both max_tokens and context_window are configured, requests dynamically cap max_tokens to stay within context_window.
        temperature:
          type: number
          minimum: 0
          maximum: 2
        system_prompt_profile:
          type: string
          enum:
          - default
          - san
          description: Explicit System Prompt and privacy profile override (`default` anonymized public/v3.1 track vs `san` local Raw-SQL Native track). Omitted when automatic model-name detection is active.
        structured_output_mode:
          type: string
          enum:
          - json_schema
          - json_object
          description: Server-managed system key negotiated by the enable probe; never accepted on write.
    AiProviderConfigurationWrite:
      type: object
      additionalProperties: false
      description: >-
        User-writable generation parameters. Providing this object replaces the
        stored user overrides as a whole (keys omitted inside a provided object
        are cleared); omitting the configuration field entirely preserves the
        stored configuration (M2 keep semantics). Unknown keys, including the
        system-managed structured_output_mode, are rejected.
      properties:
        reasoning_effort:
          type: string
          enum:
          - low
          - medium
          - high
          description: Omit entirely to use the provider default; never simulated via prompts.
        max_tokens:
          type: integer
          minimum: 256
          maximum: 200000
        context_window:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Optional model context window size in tokens (0 or omitted means unspecified). When both max_tokens and context_window are configured, requests dynamically cap max_tokens to stay within context_window.
        temperature:
          type: number
          minimum: 0
          maximum: 2
          description: 0 is a valid explicit value and is never treated as omitted.
        system_prompt_profile:
          type: string
          enum:
          - default
          - san
          description: Omit to auto-detect from normalized model_name (`xmodel`/`san`/`sql-audit-nano` v1/v2/v3 names and tags such as `xmodel-v3.1`, `san-v3.1`, `SAN-4B-v3.1`, `san:v3.1` -> `default`; versionless `san`/`sql-audit-nano` -> `san`; all others -> `default`).
    AiProviderRateWindow:
      type: object
      required:
      - id
      - start_minute
      - end_minute
      - input_price
      - output_price
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        start_minute:
          type: integer
          minimum: 0
          maximum: 1439
        end_minute:
          type: integer
          minimum: 1
          maximum: 1440
          description: Half-open [start_minute, end_minute) within a day; cross-midnight input is stored as two normalized windows.
        input_price:
          type: string
          pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$'
          description: Currency units per million input tokens (bounded decimal string).
        output_price:
          type: string
          pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$'
        cached_read_price:
          type: string
          pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$'
          description: Omitted means not configured; reported cached-read volume then stays in the base reference (partial basis).
        cached_write_price:
          type: string
          pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$'
    AiProviderRateVersion:
      type: object
      required:
      - id
      - provider_id
      - currency
      - timezone
      - effective_from
      - version
      - windows
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        provider_id:
          $ref: '#/components/schemas/Uuid'
        currency:
          type: string
          enum:
          - CNY
          - USD
        timezone:
          type: string
          description: IANA zone name used to resolve the billing time-of-day window.
        effective_from:
          $ref: '#/components/schemas/Timestamp'
        effective_until:
          $ref: '#/components/schemas/Timestamp'
        version:
          type: integer
          minimum: 1
        windows:
          type: array
          items:
            $ref: '#/components/schemas/AiProviderRateWindow'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    CreateAiProviderRateVersionRequest:
      type: object
      additionalProperties: false
      required:
      - currency
      - timezone
      - effective_from
      - windows
      properties:
        currency:
          type: string
          enum:
          - CNY
          - USD
        timezone:
          type: string
        effective_from:
          type: string
          format: date-time
        effective_until:
          type: string
          format: date-time
        windows:
          type: array
          minItems: 1
          maxItems: 24
          items:
            type: object
            additionalProperties: false
            required:
            - start_minute
            - end_minute
            - input_price
            - output_price
            properties:
              start_minute:
                type: integer
                minimum: 0
                maximum: 1439
              end_minute:
                type: integer
                minimum: 1
                maximum: 1440
                description: A value not greater than start_minute means a cross-midnight window that is normalized into two same-day windows at write time; overlap after normalization is rejected.
              input_price:
                type: string
                pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$'
              output_price:
                type: string
                pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$'
              cached_read_price:
                type: string
                pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$'
              cached_write_price:
                type: string
                pattern: '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$'
    AiCallUsage:
      type: object
      required:
      - id
      - review_run_id
      - stage_position
      - model_turn
      - call_index
      - provider_id
      - model_name
      - sent_at
      - rate_source
      - usage_reported
      - calc_basis
      - detail_note
      - outcome
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        review_run_id:
          $ref: '#/components/schemas/Uuid'
        stage_position:
          type: integer
        model_turn:
          type: integer
        call_index:
          type: integer
          description: Position within the model turn (initial attempt, backoff retries, schema-repair turn each get their own row).
        provider_id:
          $ref: '#/components/schemas/Uuid'
        model_name:
          type: string
        sent_at:
          $ref: '#/components/schemas/Timestamp'
        reasoning_effort:
          type: string
          enum:
          - low
          - medium
          - high
        max_tokens:
          type: integer
        temperature:
          type: string
          description: Bounded decimal snapshot of the configured value.
        rate_version_id:
          $ref: '#/components/schemas/Uuid'
        rate_window_id:
          $ref: '#/components/schemas/Uuid'
        rate_source:
          type: string
          enum:
          - provider_version
          - global_settings
          - none
          description: global_settings marks the legacy global-price compatibility default, never disguised as a provider-verified rate.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        input_tokens:
          type: integer
          description: Null means unknown (not reported or invalid); zero is an explicit upstream zero.
        output_tokens:
          type: integer
        cached_tokens:
          type: integer
        cache_write_tokens:
          type: integer
        reasoning_tokens:
          type: integer
          description: Detail only; never charged again on top of completion tokens.
        usage_reported:
          type: boolean
        reference_amount:
          type: string
          description: Bounded decimal reference cost in currency units; null when not computable (unknown totals or no rate).
        calc_basis:
          type: string
          enum:
          - full_detail
          - partial_detail
          - base_only
          - not_computable
        detail_note:
          type: string
        outcome:
          type: string
          enum:
          - ok
          - schema_failed
          - error
        http_status:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
    AiUsageSummary:
      type: object
      required:
      - currency
      - calls
      - reference_amount
      - computable_calls
      - input_tokens_known
      - input_tokens_cache_known
      - cached_tokens_known
      - cache_detail_samples
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Rows without an attributable currency (no rate configured) are excluded from the per-currency grouping instead of being reported with an invalid code.
        calls:
          type: integer
          description: Calls in range with an attributable currency.
        reference_amount:
          type: string
          description: Sum of computable reference amounts (bounded decimal); empty string when no call in range was computable.
        computable_calls:
          type: integer
          description: Calls with a reference amount; the sample base for coverage, missing samples never count as zero.
        input_tokens_known:
          type: integer
          description: Sum of known input tokens across all reported calls.
        input_tokens_cache_known:
          type: integer
          description: Hit-rate denominator - sum of known input tokens over the calls that reported cache detail only; missing samples never count as zero and percentages are never averaged.
        cached_tokens_known:
          type: integer
          description: Hit-rate numerator - sum of known cached-read tokens.
        cache_detail_samples:
          type: integer
          description: Number of calls (not fields) that reported cache detail; hit rate is cached_tokens_known / input_tokens_cache_known when the denominator is positive.
