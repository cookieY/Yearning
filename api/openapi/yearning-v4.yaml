      operationId: listAiProviderRateVersions
      responses:
        '200':
          description: >-
            Reference rate versions of one provider, newest first. Prices are
            bounded-decimal strings (currency units per million tokens, at most 6
            fraction digits); windows are stored in normalized same-day [start,end)
            form (cross-midnight input is split at write time).
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
