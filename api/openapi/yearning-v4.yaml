        scheduled: {type: integer, minimum: 0}
        running: {type: integer, minimum: 0}
        completed: {type: integer, minimum: 0}
        rejected: {type: integer, minimum: 0}
        withdrawn: {type: integer, minimum: 0}
        withdrawn_after_partial_execution: {type: integer, minimum: 0}
        voided: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        partial_failed: {type: integer, minimum: 0}
        cancelled: {type: integer, minimum: 0}
        partial_cancelled: {type: integer, minimum: 0}
        result_unknown: {type: integer, minimum: 0}
        blocked_datasource_unavailable: {type: integer, minimum: 0}
        missed_schedule: {type: integer, minimum: 0}
        invalid: {type: integer, minimum: 0}
