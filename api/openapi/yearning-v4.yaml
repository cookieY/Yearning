          - enabled
          - disabled
        engine:
          type: string
          enum:
          - all
          - mysql
          - postgresql
          default: all
        parameters:
          type: object
          description: 可调参数（阈值类；键命名^[a-z][a-z0-9_]{0,31}$，
            值为正整数/短字符串/布尔/短字符串数组；内置技能键集与
            类型以行内为准，值可调）。知识文本以{{参数名}}引用，
            注入时按行内当前值渲染；engine和parameters均由管理API
            持久化并参与config_hash，变化使引用旧配置的未提交Review失效。
          additionalProperties:
