                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      allOf:
                      - $ref: '#/components/schemas/Page'
                      - type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Datasource'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
    post:
      tags:
      - Administration
      operationId: createDatasource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourceWrite'
      responses:
