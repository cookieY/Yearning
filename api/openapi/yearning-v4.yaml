openapi: 3.1.0
info:
  title: Yearning v4 HTTP API
  version: 4.0.0-draft.1
  description: 'Yearning v4跨前后端契约。业务规则以docs/yearning-v4-product-contract.md为最高优先级。

    所有写操作受服务端权限、状态机、乐观锁和审计控制。

    '
servers:
- url: /api/v4
security:
- sessionCookie: []
tags:
- name: Authentication
- name: Administration
- name: Change drafts
- name: Change orders
- name: Query access
- name: Query sessions
- name: Tasks
- name: AI assistant
- name: Events
paths:
  /auth/login:
    post:
      tags:
      - Authentication
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; session and CSRF cookies issued
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      type: 'null'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
  /auth/logout:
    post:
      tags:
      - Authentication
      operationId: logout
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      type: 'null'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
  /auth/register:
    post:
      tags:
      - Authentication
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Active user with zero workflow permissions
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      $ref: '#/components/schemas/User'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
        '403':
          $ref: '#/components/responses/Problem'
  /auth/providers:
    get:
      tags:
      - Authentication
      security: []
      operationId: listAuthenticationProviders
      responses:
        '200':
          description: Enabled login methods without secrets
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      type: object
                      required:
                      - local
                      - ldap
                      - oidc
                      properties:
                        local:
                          type: boolean
                        ldap:
                          type: boolean
                        oidc:
                          type: array
                          items:
                            type: object
                            required:
                            - key
                            - label
                            - start_url
                            properties:
                              key:
                                type: string
                              label:
                                type: string
                              start_url:
                                type: string
                        branding:
                          type: object
                          description: >-
                            Public branding fields configured under the branding settings
                            namespace (product_name and plain-text login_description).
                          required:
                          - product_name
                          - login_description
                          properties:
                            product_name:
                              type: string
                              minLength: 1
                              maxLength: 64
                            login_description:
                              type: string
                              maxLength: 500
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
  /auth/ldap/login:
    post:
      tags:
      - Authentication
      security: []
      operationId: loginWithLdap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; first login creates zero-permission user
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      type: 'null'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
  /auth/oidc/{provider_key}/start:
    get:
      tags:
      - Authentication
      security: []
      operationId: startOidcLogin
      parameters:
      - name: provider_key
        in: path
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Redirect with one-time state
  /auth/oidc/{provider_key}/callback:
    get:
      tags:
      - Authentication
      security: []
      operationId: finishOidcLogin
      parameters:
      - name: provider_key
        in: path
        required: true
        schema:
          type: string
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Server session created; redirect contains no token
        '401':
          $ref: '#/components/responses/Problem'
  /users/me:
    get:
      tags:
      - Authentication
      operationId: getCurrentUser
      responses:
        '200':
          description: Current identity and effective UI capabilities
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      $ref: '#/components/schemas/CurrentUser'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /users/me/password:
    post:
      tags:
      - Authentication
      operationId: changeMyPassword
      summary: Self-service local password change
      description: >-
        Verifies the old password, applies the 12-character minimum policy,
        stores a fresh Argon2id hash and revokes every session of the user
        (including the current one — the client must return to the login
        screen). Accounts bound to an external identity provider are rejected
        with PASSWORD_MANAGED_BY_IDENTITY_SOURCE. The builtin admin may change
        its own password here; the login lockout is only ever cleared by the
        CLI reset command, never by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMyPasswordRequest'
      responses:
        '200':
          description: Password changed; all sessions revoked
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      type: 'null'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /admin/users:
    get:
      tags:
      - Administration
      operationId: listUsers
      parameters:
      - name: q
        in: query
        description: >-
          Case-insensitive substring matched against username, display_name or email
          (admin list server-side search, migration contract §18.73). Composes
          with the cursor walk; never widens authorization.
        schema:
          type: string
      - name: kind
        in: query
        description: >-
          Narrows the admin user list by account kind: builtin_admin matches the
          built-in administrator, local_user matches local users. AND-composes with
          q and the cursor walk; an unknown value is rejected with 1001; omitted
          keeps the unfiltered list.
        schema:
          type: string
          enum:
          - builtin_admin
          - local_user
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Business result
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      allOf:
                      - $ref: '#/components/schemas/Page'
                      - type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/User'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - Administration
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: User created and immediately active with no permissions
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      $ref: '#/components/schemas/User'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
        '403':
          $ref: '#/components/responses/Problem'
  /admin/users/{user_id}:
    parameters:
    - $ref: '#/components/parameters/UserId'
    patch:
      tags:
      - Administration
      operationId: updateUser
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      $ref: '#/components/schemas/User'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
    delete:
      tags:
      - Administration
      operationId: deleteUser
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: User deleted and sessions revoked
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      type: 'null'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
  /admin/users/{user_id}/password:
    parameters:
    - $ref: '#/components/parameters/UserId'
    post:
      tags:
      - Administration
      operationId: resetUserPassword
      summary: Admin reset of a local user's password
      description: >-
        Resets a local non-builtin user's password to a temporary value meeting
        the 12-character policy and revokes all active sessions for that user.
        Rejects the builtin admin (ADMIN_IMMUTABLE) and external identity users
        (PASSWORD_MANAGED_BY_IDENTITY_SOURCE).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetUserPasswordRequest'
      responses:
        '200':
          description: User password reset and sessions revoked
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      type: 'null'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /admin/users/{user_id}/deletion-impact:
    parameters:
    - $ref: '#/components/parameters/UserId'
    get:
      tags:
      - Administration
      operationId: getUserDeletionImpact
      responses:
        '200':
          description: Current templates
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      $ref: '#/components/schemas/UserDeletionImpact'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
  /admin/flows:
    get:
      tags:
      - Administration
      operationId: listFlows
      parameters:
      - name: q
        in: query
        description: >-
          Case-insensitive substring matched against the flow name
          (admin list server-side search, migration contract §18.73). Composes
          with the cursor walk; never widens authorization.
        schema:
          type: string
      - name: flow_type
        in: query
        description: >-
          Narrows the admin flow list by flow type (exact enum match).
          AND-composes with q, enabled and the cursor walk; an unknown value is
          rejected with 1001; omitted keeps the unfiltered list.
        schema:
          type: string
          enum:
          - change_review
          - query_access
      - name: enabled
        in: query
        description: >-
          Narrows the admin flow list by enabled flag. AND-composes with q,
          flow_type and the cursor walk; an unparsable value is rejected with 1001;
          omitted keeps the unfiltered list.
        schema:
          type: boolean
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Business result
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      allOf:
                      - $ref: '#/components/schemas/Page'
                      - type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/Flow'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
    post:
      tags:
      - Administration
      operationId: createFlow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowWrite'
      responses:
        '200':
          description: Flow created
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      $ref: '#/components/schemas/Flow'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
  /admin/flows/{flow_id}:
    parameters:
    - $ref: '#/components/parameters/FlowId'
    get:
      tags:
      - Administration
      operationId: getFlow
      responses:
        '200':
          description: Flow
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      $ref: '#/components/schemas/Flow'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
    put:
      tags:
      - Administration
      operationId: replaceFlow
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowWrite'
      responses:
        '200':
          description: Updated template; submitted snapshots unchanged
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      $ref: '#/components/schemas/Flow'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
    delete:
      tags:
      - Administration
      operationId: deleteFlow
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Deleted only when never referenced
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      type: 'null'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
  /admin/flows/{flow_id}/masking-rules:
    parameters:
    - $ref: '#/components/parameters/FlowId'
    get:
      tags:
      - Administration
      operationId: listFlowMaskingRules
      responses:
        '200':
          description: Sensitive column vocabulary per datasource of the flow
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      type: object
                      additionalProperties: false
                      required:
                      - items
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/FlowMaskingRule'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
        '403':
          $ref: '#/components/responses/Problem'
  /admin/flows/{flow_id}/datasources/{datasource_id}/masking-rules:
    parameters:
    - $ref: '#/components/parameters/FlowId'
    - $ref: '#/components/parameters/DatasourceId'
    put:
      tags:
      - Administration
      operationId: replaceFlowMaskingRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowMaskingRuleWrite'
      responses:
        '200':
          description: Replaced vocabulary for one datasource of the flow
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      $ref: '#/components/schemas/FlowMaskingRule'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
        '403':
          $ref: '#/components/responses/Problem'
  /admin/migrations:
    get:
      tags: [Administration]
      operationId: listLegacyMigrationRuns
      description: Available only while the server is explicitly started in migration mode.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      responses:
        '200': {$ref: '#/components/responses/LegacyMigrationRunPageResult'}
  /admin/migrations/{migration_run_id}:
    parameters:
    - $ref: '#/components/parameters/MigrationRunId'
    get:
      tags: [Administration]
      operationId: getLegacyMigrationRun
      description: Returns the redacted reconciliation report and candidate mappings; never returns SQL, credentials, TLS material or raw schema mappings.
      responses:
        '200': {$ref: '#/components/responses/LegacyMigrationRunResult'}
  /admin/migrations/{migration_run_id}/candidate-mappings/{candidate_id}/confirmation:
    parameters:
    - $ref: '#/components/parameters/MigrationRunId'
    - $ref: '#/components/parameters/MigrationCandidateId'
    put:
      tags: [Administration]
      operationId: confirmLegacyMigrationCandidate
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmLegacyMigrationCandidateRequest'}
      responses:
        '200': {$ref: '#/components/responses/LegacyMigrationRunResult'}
  /admin/migrations/{migration_run_id}/approval:
    parameters:
    - $ref: '#/components/parameters/MigrationRunId'
    post:
      tags: [Administration]
      operationId: approveLegacyMigrationRun
      description: Approves exactly one canonical manifest after every candidate is confirmed. Approval does not start Apply; only the offline migration command may do so.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApproveLegacyMigrationRunRequest'}
      responses:
        '200': {$ref: '#/components/responses/LegacyMigrationRunResult'}
  /admin/identity-providers:
    get:
      tags: [Administration]
      operationId: listIdentityProviders
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      responses:
        '200': {$ref: '#/components/responses/IdentityProviderPageResult'}
    post:
      tags: [Administration]
      operationId: createIdentityProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateIdentityProviderRequest'}
      responses:
        '200': {$ref: '#/components/responses/IdentityProviderResult'}
  /admin/identity-providers/{identity_provider_id}:
    parameters:
    - $ref: '#/components/parameters/IdentityProviderId'
    get:
      tags: [Administration]
      operationId: getIdentityProvider
      responses:
        '200': {$ref: '#/components/responses/IdentityProviderResult'}
    put:
      tags: [Administration]
      operationId: replaceIdentityProvider
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplaceIdentityProviderRequest'}
      responses:
        '200': {$ref: '#/components/responses/IdentityProviderResult'}
    delete:
      tags: [Administration]
      operationId: deleteIdentityProvider
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': {$ref: '#/components/responses/NullBusinessResult'}
  /admin/identity-providers/{identity_provider_id}/connection-tests:
    parameters:
    - $ref: '#/components/parameters/IdentityProviderId'
    post:
      tags: [Administration]
      operationId: testIdentityProviderConnection
