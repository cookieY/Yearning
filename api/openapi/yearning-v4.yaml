      properties:
        sensitive_columns:
          type: array
          description: Literal column names normalized with Unicode default full case folding; both input and normalized values must be 1 to 128 Unicode code points.
          maxItems: 256
          items:
            type: string
            minLength: 1
            maxLength: 128
    DatasourceWrite:
      type: object
      additionalProperties: false
      required:
      - name
      - engine
      - compatibility_mode
      - deployment_kind
      - host
      - port
      - enabled
      - credentials
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        engine:
          type: string
          enum:
          - mysql
          - postgresql
          - tidb
          - oceanbase
          - polardb
        compatibility_mode:
          type: string
          enum:
          - mysql
          - postgresql
        deployment_kind:
          type: string
          enum:
          - native
          - cloud
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        database_name:
          type:
          - string
          - 'null'
          maxLength: 128
        version_constraint:
          type: string
          minLength: 1
          maxLength: 64
          description: Optional version constraint. When omitted on create, defaults from the capability matrix for the engine and compatibility_mode; when omitted on replace, preserves the stored value or falls back to the matrix default.
        enabled:
          type: boolean
        test_purpose:
          type: string
          enum:
          - review
          - query
          - execution
          default: review
          description: Connection test purpose stored on the datasource; the
            connection-test action probes with this purpose's stored credential.
            Full-replacement semantics like every other field — omitting it resets
            the purpose to review.
        credentials:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/CredentialWrite'
        tls:
          $ref: '#/components/schemas/DatasourceTLSWrite'
    DatasourceTLSWrite:
      type:
      - object
      - 'null'
      additionalProperties: false
      description: 'Optional TLS material block with three-state semantics on
        the replace path (RCP-20261016-DATASOURCE-TLS-KEEP): omitting tls keeps
        the stored TLS material and tls_verified unchanged (the material content
        is re-sealed per the payload''s credential purposes so every enabled
        purpose retains verified TLS); tls:null explicitly removes all stored
        material and the datasource connects in plaintext; a tls object fully
        replaces the material and must carry a non-null ca_pem (an all-null
        material object is rejected). On the create path omitting and null are
        equivalent (no existing material to keep). When material is present the
        adapter enforces verified TLS (full chain plus hostname verification);
        there is no skip-verification path. Materials are write-only and never
        echoed; reads only expose tls_verified on the datasource view.'
      properties:
        ca_pem:
          oneOf:
          - $ref: '#/components/schemas/SecretInput'
          - type: 'null'
          description: PEM-encoded CA certificate chain for server certificate verification.
        client_cert_pem:
          oneOf:
          - $ref: '#/components/schemas/SecretInput'
          - type: 'null'
          description: PEM-encoded client certificate for mutual TLS; must be supplied
            together with client_key_pem.
        client_key_pem:
          oneOf:
          - $ref: '#/components/schemas/SecretInput'
          - type: 'null'
          description: PEM-encoded client private key for mutual TLS; must be supplied
            together with client_cert_pem.
    Datasource:
      type: object
      required:
      - id
      - name
      - engine
      - compatibility_mode
