  /admin/ai-usage/calls:
    get:
      tags:
      - Administration
      operationId: listAiUsageCalls
      parameters:
      - name: provider_id
        in: query
        description: >-
          Filter per-HTTP-call usage rows by AI provider (RCP-20261102-S008:
          provider-scoped ledger without client-side page filtering).
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: run_id
        in: query
        description: Filter per-HTTP-call usage rows by review run.
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: currency
        in: query
        description: Filter by three-letter currency code (CNY or USD).
        schema:
          type: string
          pattern: '^[A-Z]{3}$'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: >-
            Per-HTTP-call reference usage ledger (append-only; every real call
            including backoff retries, schema-repair turns and fallback attempts
            gets its own row bound to the rate selected at its send time). Null
            usage fields mean unknown (missing or invalid upstream), never zero.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      allOf:
                      - $ref: '#/components/schemas/Page'
                      - type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/AiCallUsage'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
  /admin/ai-usage/summary:
    get:
      tags:
      - Administration
      operationId: listAiUsageSummary
      parameters:
      - name: from
        in: query
        description: >-
          Inclusive RFC3339 lower bound on call send time. Defaults to 30 days
          before to.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Exclusive RFC3339 upper bound on call send time. Defaults to now.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: >-
            Reference-cost totals grouped by currency; currencies are aggregated
            separately and never converted. Hit-rate inputs expose the known
            sample counts so missing samples are never averaged as zero.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/AiUsageSummary'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
