        evidence_count:
          type: integer
          minimum: 0
        snapshot_hash:
          type: string
        summary:
          type: string
          nullable: true
          maxLength: 4000
          description: Accepted model summary frozen with the review stage in its original output language. Null until a final model response has been accepted.
        summary_locale:
          type: string
          enum:
          - zh-CN
          - en-US
          nullable: true
          description: Language of the frozen accepted summary. Null exactly when summary is null.
    SubmissionGate:
      type: object
      additionalProperties: false
      required:
      - passed
      - reason_codes
      properties:
        passed:
          type: boolean
        reason_codes:
          type: array
          uniqueItems: true
          items:
            type: string
    ReviewRun:
      type: object
      additionalProperties: false
      required:
      - id
      - draft_id
      - draft_revision
      - state
      - statement_count
      - fingerprint_group_count
      - stage_results
      - gate
      - version
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        draft_id:
          type: string
          pattern: '^($|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
          description: >-
            Associated change draft UUID, or empty string when precheck ran
            ephemerally without a saved draft (RCP-20261101 / RCP-20261125).
        draft_revision:
          type: integer
          minimum: 0
          description: >-
            Persisted draft revision (>= 1), or 0 when precheck ran ephemerally
            without a persisted draft revision (RCP-20261101 / RCP-20261125).
        state:
          $ref: '#/components/schemas/ReviewRunState'
        statement_count:
          type: integer
          minimum: 0
          maximum: 100000
        fingerprint_group_count:
          type: integer
          minimum: 0
          maximum: 1000
        stage_results:
          type: array
          items:
            $ref: '#/components/schemas/ReviewStageResult'
        gate:
          $ref: '#/components/schemas/SubmissionGate'
        usage:
          oneOf:
          - $ref: '#/components/schemas/ReviewRunUsage'
          - type: 'null'
          description: >-
            Real AI identity and token usage aggregated from the run's model
            calls (OBS-001 decision - visible to submitters and approvers).
            Null while no model call has completed.
        failure_code:
          type:
          - string
          - 'null'
        version:
          type: integer
          minimum: 1
        created_at:
          $ref: '#/components/schemas/Timestamp'
        started_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        finished_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
    ReviewFinding:
      type: object
      additionalProperties: false
      required:
      - id
      - stage_position
      - category
      - severity
      - title
      - message
      - evidence_ids
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        stage_position:
          type: integer
          minimum: 1
        fingerprint_group_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        category:
          type: string
        severity:
          type: string
          enum:
          - info
          - low
          - medium
          - high
          - critical
        title:
          type: string
        message:
          type: string
        suggestion:
          type:
          - string
          - 'null'
        model_confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        evidence_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
    ReviewEvidence:
      type: object
      additionalProperties: false
      required:
      - id
      - source_kind
      - source_reference
      - fact_status
      - normalized_fact
      - has_raw_payload
      - collected_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        source_kind:
          type: string
        source_reference:
          type: string
        fact_status:
          type: string
          enum:
          - known
          - unknown
          - unavailable
          - stale
        normalized_fact:
          type: object
          description: 'Anonymized normalized fact. Values may carry review-scoped
            stable anonymous identifier tokens (e.g. table_1/schema_1), never real
            identifiers; authorized reveal is an explicit action via POST /review-runs/{review_run_id}/identifier-mapping-reveals
            (RCP-20261022, audited per action).'
          x-anonymized-tokens: review_scoped_stable_anonymous_tokens
        has_raw_payload:
          type: boolean
        raw_payload_expires_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        collected_at:
          $ref: '#/components/schemas/Timestamp'
    IdentifierMappingRevealRequest:
      type: object
      additionalProperties: false
      description: 'Tokens to reveal, or the whole mapping with all=true. Exactly
        one of tokens/all; unknown tokens fail the whole request (fail-closed, no
        partial mapping).'
      properties:
        tokens:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            minLength: 1
        all:
          type: boolean
          default: false
    IdentifierMappingReveal:
      type: object
      additionalProperties: false
      required:
      - review_run_id
      - mappings
      - revealed_at
      properties:
        review_run_id:
          $ref: '#/components/schemas/Uuid'
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/IdentifierMappingRevealed'
        revealed_at:
          $ref: '#/components/schemas/Timestamp'
    IdentifierMappingRevealed:
      type: object
      additionalProperties: false
      required:
      - token
      - kind
      - identifier
      properties:
        token:
          type: string
          description: The anonymous token as it appears in anonymized evidence.
        kind:
          type: string
          enum:
          - database
          - schema
          - table
          - column
          - index
          - constraint
          - alias
          - cte
          - ident
        identifier:
          type: string
          description: The real identifier the token maps to.
    RawEvidenceReveal:
      type: object
      additionalProperties: false
      required:
      - reveal_id
      - content_type
      - raw_payload
      - watermark
      - valid_until
      properties:
        reveal_id:
          $ref: '#/components/schemas/Uuid'
        content_type:
          type: string
          enum:
          - application/json
          - text/plain
        raw_payload:
          oneOf:
          - type: object
          - type: array
          - type: string
        watermark:
          type: string
        valid_until:
          $ref: '#/components/schemas/Timestamp'
    CreateCommentRequest:
      type: object
      additionalProperties: false
      required:
      - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4096
    ChangeOrderComment:
      type: object
      additionalProperties: false
      required:
      - id
      - order_id
      - author_user_id
      - author_display_name
      - content
      - occurred_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        order_id:
          $ref: '#/components/schemas/Uuid'
        author_user_id:
          $ref: '#/components/schemas/Uuid'
        author_display_name:
          type: string
        content:
          type: string
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
    ChangeOrderTimelineEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - event_type
      - occurred_at
      - actor_kind
      - summary
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        event_type:
          type: string
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        actor_kind:
          type: string
          enum:
          - user
          - system
          - worker
        actor_user_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        actor_display_name:
          type:
          - string
          - 'null'
        summary:
          type: string
        comment:
          type:
          - string
          - 'null'
          description: Approval/rejection comment carried by
            change_order.approval_decided events (BUG-004 read face;
            optional and absent on non-decision events).
        stage_position:
          type:
          - integer
          - 'null'
          minimum: 1
        state:
          type:
          - string
          - 'null'
    ApprovalDecisionRequest:
      type: object
      additionalProperties: false
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
        comment:
          type: string
          maxLength: 4096
    ScheduleRequest:
      type: object
      additionalProperties: false
      required:
      - scheduled_for
      properties:
        scheduled_for:
          $ref: '#/components/schemas/Timestamp'
    ReasonRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 4096
    ExecutionAttemptRequest:
      type: object
      additionalProperties: false
      properties:
        ddl_execution_mode:
          description: >-
            Optional per-attempt DDL execution mode when osc_choice_available is true:
            gh_ost uses the built-in in-process gh-ost migrator; online_ddl runs
            directly via MySQL native Online DDL (INSTANT / INPLACE).
          type: string
          enum:
          - gh_ost
          - online_ddl
        osc_overrides:
          $ref: '#/components/schemas/OscOverrides'
    ExecutionAttempt:
      type: object
      additionalProperties: false
      required:
      - id
      - stage_id
      - execution_kind
      - state
      - send_boundary
      - version
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        stage_id:
          $ref: '#/components/schemas/Uuid'
        execution_kind:
          type: string
          enum: [ddl, dml, gh_ost]
        state:
          type: string
          enum:
          - created
          - preflight
          - running
          - cancelling
          - succeeded
          - failed
          - partial_failed
          - cancelled
          - partial_cancelled
          - result_unknown
        send_boundary:
          type: string
          enum:
          - not_started
          - sending
          - sent
        osc:
          oneOf:
          - $ref: '#/components/schemas/OscExecutionDetails'
          - type: 'null'
        version:
          type: integer
          minimum: 1
        created_at:
          $ref: '#/components/schemas/Timestamp'
    OscPolicy:
      type: object
      additionalProperties: false
      required: [tool, defaults]
      properties:
        tool:
          type: string
          enum: [none, gh-ost, pt-osc]
        defaults:
          $ref: '#/components/schemas/OscOverrides'
    OscOverrides:
      type: object
      additionalProperties: false
      properties:
        max_load:
          type: string
          pattern: '^[A-Za-z_]+=[0-9]{1,9}(,[A-Za-z_]+=[0-9]{1,9})*$'
        critical_load:
          type: string
          pattern: '^[A-Za-z_]+=[0-9]{1,9}(,[A-Za-z_]+=[0-9]{1,9})*$'
        critical_load_interval_millis:
          type: integer
          minimum: 0
          maximum: 60000
        critical_load_hibernate_seconds:
          type: integer
          minimum: 0
          maximum: 86400
        chunk_size:
          type: integer
          minimum: 1
          maximum: 100000
        dml_batch_size:
          type: integer
          minimum: 1
          maximum: 1000
        max_lag:
          type: integer
          minimum: 0
          maximum: 86400
        nice_ratio:
          type: number
          minimum: 0
          maximum: 100
        cut_over_lock_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 30
        retries:
          type: integer
          minimum: 1
          maximum: 120
        heartbeat_interval_millis:
          type: integer
          minimum: 50
          maximum: 10000
        exponential_backoff_max_interval:
          type: integer
          minimum: 2
          maximum: 640
        exact_rowcount:
          type: boolean
        concurrent_rowcount:
          type: boolean
        ok_to_drop_table:
          type: boolean
        timestamp_old_table:
          type: boolean
        cut_over_exponential_backoff:
          type: boolean
        attempt_instant_ddl:
          type: boolean
    OscExecutionDetails:
      type: object
      additionalProperties: false
      required: [tool, tool_version, binary_sha256, plan_hash, phase, progress_basis_points, rows_copied, residual_state]
      properties:
        tool: {type: string, enum: [gh-ost, pt-osc]}
        tool_version: {type: string, minLength: 1}
        binary_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        plan_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        phase:
          type: string
          enum: [planned, preflight, copying, postponed_cutover, cutover, cleanup, succeeded, failed, cancelled, result_unknown]
        progress_basis_points: {type: integer, minimum: 0, maximum: 10000}
        rows_copied: {type: integer, minimum: 0}
        residual_state:
          type: string
          enum: [not_checked, none, detected, cleanup_required, cleaned]
        last_heartbeat_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
    ExecutionStatement:
      type: object
      additionalProperties: false
      required: [id, ordinal, statement_kind, state]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        ordinal: {type: integer, minimum: 1, maximum: 100000}
        statement_kind: {type: string, enum: [ddl, dml]}
        state: {type: string, enum: [not_started, sent, succeeded, failed, cancelled, unknown, skipped]}
        affected_row_count:
          type: [integer, 'null']
          minimum: 0
        failure_name:
          type: [string, 'null']
        started_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        finished_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
    ExecutionSchedule:
      type: object
      required:
      - id
      - stage_id
      - scheduled_for
      - state
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        stage_id:
          $ref: '#/components/schemas/Uuid'
        scheduled_for:
          $ref: '#/components/schemas/Timestamp'
        state:
          type: string
          enum:
          - scheduled
          - running
          - cancelled
          - missed
          - blocked
    ExecutionVerificationRequest:
      type: object
      additionalProperties: false
      required:
      - result
      - reason
      - evidence
      properties:
        result:
          type: string
          enum:
          - confirmed_succeeded
          - confirmed_failed
          - confirmed_partial
          - still_unknown
        reason:
          type: string
          minLength: 1
          maxLength: 4096
        evidence:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - kind
            - content
            properties:
              kind:
                type: string
                enum:
                - text
                - database_fact
                - external_reference
              content:
                type: string
                minLength: 1
                maxLength: 16384
    CreateQueryAccessRequest:
      type: object
      additionalProperties: false
      required:
      - flow_id
      - datasource_ids
      - requested_until
      - reason
      properties:
        flow_id:
          $ref: '#/components/schemas/Uuid'
        datasource_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
        requested_until:
          description: >-
            Requested validity bound as wall-clock time (OBS-009 /
            RCP-20261021): the date-time digits are reinterpreted in the
            server's general.system_timezone (default Asia/Shanghai), not
            taken as a UTC instant. Send the wall clock with a Z marker,
            minute granularity.
          allOf:
          - $ref: '#/components/schemas/Timestamp'
        reason:
          type: string
          minLength: 1
          maxLength: 4096
    CreateQueryGrantRenewalRequest:
      type: object
      additionalProperties: false
      required:
      - requested_until
      - reason
      properties:
        requested_until:
          description: >-
            Requested validity bound as wall-clock time, identical to
            CreateQueryAccessRequest.requested_until (OBS-009 /
            RCP-20261021): the digits are reinterpreted in the server's
            general.system_timezone, not taken as a UTC instant. The renewal
            path reanchors exactly like the create path.
          allOf:
          - $ref: '#/components/schemas/Timestamp'
        reason:
          type: string
          minLength: 1
          maxLength: 4096
    QueryAccessRequestState:
      type: string
      enum:
      - access_pending
      - grant_active
      - access_rejected
      - withdrawn
      - invalid
    QueryOrderEntry:
      type: object
      additionalProperties: false
      required:
      - kind
      - id
      - created_at
      properties:
        kind:
          type: string
          enum:
          - access_request
          - session
          description: 条目来源；request 与 session 按 kind 二选一出现。
        id:
          $ref: '#/components/schemas/Uuid'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        request:
          $ref: '#/components/schemas/QueryAccessRequest'
        session:
          $ref: '#/components/schemas/QuerySession'
    QueryAccessRequest:
      type: object
      required:
      - id
      - requester_user_id
      - state
      - datasource_ids
      - version
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        flow_id:
          $ref: '#/components/schemas/Uuid'
          description: Frozen query_access flow ID this request was submitted against.
        requester_user_id:
          $ref: '#/components/schemas/Uuid'
        applicant_name:
          type:
          - string
          - 'null'
          description: Display name of the requester at read time (null when
            the user was deleted; callers fall back to requester_user_id).
        state:
          $ref: '#/components/schemas/QueryAccessRequestState'
        datasource_ids:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        datasource_names:
          type: array
          description: Datasource display names aligned by index with
            datasource_ids (empty string when the datasource was deleted).
          items:
            type: string
        grant_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        version:
          type: integer
          minimum: 1
        created_at:
          $ref: '#/components/schemas/Timestamp'
        reason:
          type:
          - string
          - 'null'
          description: Application reason submitted by the requester (snapshot
            of the original request payload).
        requested_until:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        terminal_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
          description: Time the request reached a terminal state (rejected,
            withdrawn or invalid); null while pending or under an active grant.
        can_decide:
          type: boolean
          description: Whether the current session actor is a frozen approver of the currently active step on an access_pending request (authoritative server-side eligibility).
    QueryGrantState:
      type: string
      enum:
      - active
      - revoked
      - expired
      - relinquished
    QueryGrant:
      type: object
      required:
      - id
      - requester_user_id
      - state
      - version
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        requester_user_id:
          $ref: '#/components/schemas/Uuid'
        holder_name:
          type:
          - string
          - 'null'
          description: Frozen username snapshot of the grant holder
            (requester_user_id_snapshot twin; survives user deletion).
        state:
          $ref: '#/components/schemas/QueryGrantState'
        revoked_reason:
          type:
          - string
          - 'null'
        revoked_by_username:
          type:
          - string
          - 'null'
          description: Display-name snapshot of the revoking operator, captured
            at revocation time (RCP-20260901-QUERY-REVOCATION-READ-FACE).
        revoked_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        expires_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        version:
          type: integer
          minimum: 1
        created_at:
          $ref: '#/components/schemas/Timestamp'
        can_revoke:
          type: boolean
          description: Whether the current session actor is eligible to revoke this active grant (frozen approver of the originating access request or builtin admin).
    CreateQuerySession:
      type: object
      additionalProperties: false
      required:
      - flow_id
      - datasource_ids
      properties:
        flow_id:
          $ref: '#/components/schemas/Uuid'
        grant_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        datasource_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
    QuerySessionState:
      type: string
      enum:
      - active
      - closed
      - revoked
      - expired
      - user_deleted
    QuerySessionDatasourceState:
      type: string
      enum:
      - active
      - datasource_unavailable
      - identity_changed
    QuerySessionCapability:
      type: object
      additionalProperties: false
      required:
      - datasource_id
      - datasource_name
      - state
      - can_query
      - can_export
      properties:
        datasource_id:
          $ref: '#/components/schemas/Uuid'
        datasource_name:
          type: string
        state:
          $ref: '#/components/schemas/QuerySessionDatasourceState'
        can_query:
          type: boolean
          const: true
        can_export:
          type: boolean
    QueryExecutionHistoryItem:
      type: object
      additionalProperties: false
      required:
      - id
      - datasource_id
      - sql
      - state
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        datasource_id:
          $ref: '#/components/schemas/Uuid'
        sql:
          type: string
        state:
          type: string
        elapsed_ms:
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    QuerySession:
      type: object
      required:
      - id
      - user_id
      - state
      - capabilities
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        user_id:
          $ref: '#/components/schemas/Uuid'
        state:
          $ref: '#/components/schemas/QuerySessionState'
        grant_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: Grant this session was authorized through (exact
            association for revocation visibility,
            RCP-20260901-QUERY-SESSION-GRANT-REF); null when the flow's query
            approval mode is off (direct-connection sessions carry no grant).
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/QuerySessionCapability'
        executions:
          type: array
          items:
            $ref: '#/components/schemas/QueryExecutionHistoryItem'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    DatasourceSchema:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
    DatasourceTable:
      type: object
      additionalProperties: false
      required:
      - schema_name
      - table_name
      - relation_kind
      properties:
        schema_name:
          type: string
        table_name:
          type: string
        relation_kind:
          type: string
          enum:
          - table
          - view
          - materialized_view
    DatasourceColumn:
      type: object
      additionalProperties: false
      required:
      - schema_name
      - table_name
      - column_name
      - ordinal
      - data_type
      - nullable
      - masked
      properties:
        schema_name:
          type: string
        table_name:
          type: string
        column_name:
          type: string
        ordinal:
          type: integer
          minimum: 1
        data_type:
          type: string
        nullable:
          type: boolean
        masked:
          type: boolean
        column_key:
          type: string
          description: SHOW FULL FIELDS对齐的键信息（MySQL PRI/UNI/MUL；PostgreSQL无直接对应，恒为空串）。空串表示无。
        column_default:
          type: string
          description: 列默认值表达式；空串表示无默认值。
        extra:
          type: string
          description: 额外信息（MySQL auto_increment等；PostgreSQL按identity/generated映射）。空串表示无。
        comment:
          type: string
          description: 列注释；空串表示无注释。
    ExecuteQueryRequest:
      type: object
      additionalProperties: false
      required:
      - datasource_id
      - schema_name
      - sql
      properties:
        datasource_id:
          $ref: '#/components/schemas/Uuid'
        schema_name:
          type: string
          minLength: 1
          maxLength: 128
        sql:
          type: string
          minLength: 1
          description: 分号分隔的多条纯SELECT语句批次（F-Q-001，owner
            2026-10-30裁定）：逐条确定性强分类，任一非纯SELECT整批拒绝；
            批次在同一只读连接/事务按序执行，结果集为最后一条语句的
            结果；字符串与注释内的分号不构成分隔。尾分号等空段允许。
            批次最多16条语句，超限整批拒绝（4007）。
        timeout_ms:
          type: integer
          minimum: 1
          maximum: 300000
          default: 30000
        page_size:
          type: integer
          minimum: 1
          maximum: 5000
          default: 500
    QueryResultPage:
