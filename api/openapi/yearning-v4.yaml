        sensitive fields; the secret envelope stores either the raw webhook
        access token or a JSON object {"access_token": "...", "sign_secret":
        "..."} — the optional sign secret is required when the robot uses the
        sign security mode and requests then carry the official timestamp+
        signature query parameters.
