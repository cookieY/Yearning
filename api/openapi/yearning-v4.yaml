  /review-runs:
    post:
      tags:
      - Change drafts
      operationId: runDraftReview
      description: >-
        Ephemeral AI precheck (RCP-20261101-EPHEMERAL-PRECHECK). The request
        carries the current editor SQL plus the flow; nothing is persisted
        before submission - no draft row, no SQL payload, no run rows. The
        run executes in process memory with a TTL and is readable via
        GET /review-runs/{review_run_id} until it expires or the process
        restarts, after which the client must precheck again. Submitting an
        order materializes the accepted run. draft_id is optional UI
        anchoring only and is never written by this operation.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: Accept-Language
        in: header
        required: false
        description: >-
          Language preference for AI summary and finding title/message/suggestion.
          zh/en variants are negotiated in preference order to zh-CN/en-US;
          unsupported or malformed preferences default to zh-CN. The chosen locale
          is frozen when review starts, including retries and model turns.
        schema:
          type: string
          maxLength: 1024
          example: zh-CN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - flow_id
              - sql
              properties:
                flow_id:
                  $ref: '#/components/schemas/Uuid'
                draft_id:
                  $ref: '#/components/schemas/Uuid'
                sql:
                  type: string
                  description: Current editor SQL reviewed verbatim (max 32 MiB).
                target_database:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 128
                  description: Optional default database override for MySQL-compatible stages, or optional Target Schema override within the connected Database for PostgreSQL stages; explicit null clears any draft-level override during ephemeral precheck without mutating the draft.
                output_locale:
                  type: string
                  description: Optional explicit locale; overrides the header when present.
                  maxLength: 16
      responses:
        '200':
          description: Ephemeral run accepted
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      type: object
                      additionalProperties: false
                      required:
                      - run_id
                      properties:
                        run_id:
                          $ref: '#/components/schemas/Uuid'
                        result_ref:
                          type: string
                          description: Read path of the ephemeral run (/review-runs/{run_id}).
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
        '429':
          $ref: '#/components/responses/Problem'
