      - compatibility_mode
      - engine_fingerprint
      - yearning_fingerprint
      - database_or_schema
      - template_status
      - template_sql
      - template_note
      - coverage_mode
      - from
      - to
      - summary
      - cost_unit_notes
      - trend_series
      - cost_series
      - order_comparison
      - latest_ai_report
      properties:
        statement_id:
          $ref: '#/components/schemas/Uuid'
        datasource_id:
          $ref: '#/components/schemas/Uuid'
        engine:
          type: string
        compatibility_mode:
          type: string
        engine_fingerprint:
          type: string
        yearning_fingerprint:
          type:
          - string
          - 'null'
        database_or_schema:
          type: string
        template_status:
          type: string
          enum:
          - not_fetched
          - available
          - unavailable
        template_sql:
          type:
          - string
          - 'null'
        template_note:
          type:
          - string
          - 'null'
        coverage_mode:
          $ref: '#/components/schemas/DiagnosticsCoverageMode'
        from:
          $ref: '#/components/schemas/Timestamp'
        to:
          $ref: '#/components/schemas/Timestamp'
        summary:
          $ref: '#/components/schemas/DiagnosticsStatementSummary'
        cost_unit_notes:
          type: object
          additionalProperties:
            type: string
        trend_series:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticsStatementTrendPoint'
        cost_series:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticsStatementCostPoint'
        order_comparison:
          $ref: '#/components/schemas/DiagnosticsOrderComparison'
        latest_ai_report:
          oneOf:
          - $ref: '#/components/schemas/DiagnosticAiReport'
          - type: 'null'
    ConfirmDiagnosticOrderLinkRequest:
      type: object
      additionalProperties: false
      required:
      - change_order_id
      - relation_kind
      properties:
        change_order_id:
          $ref: '#/components/schemas/Uuid'
        relation_kind:
          type: string
          enum:
          - same_fingerprint
          - rewritten_fingerprint_confirmed
          - index_or_schema_change
        target_statement_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
    DiagnoseStatementWithAiRequest:
      type: object
      additionalProperties: false
      properties:
        from:
          type:
          - string
          - 'null'
          format: date-time
        to:
          type:
          - string
          - 'null'
          format: date-time
    PrecheckDiagnosticOptimizationDraftRequest:
      type: object
      additionalProperties: false
      required:
      - flow_id
      properties:
        flow_id:
          $ref: '#/components/schemas/Uuid'
        candidate_sql:
          type:
          - string
          - 'null'
    PrecheckDiagnosticOptimizationDraftResponse:
      type: object
      additionalProperties: false
      required:
      - report
      - run_id
      - result_ref
      properties:
        report:
          $ref: '#/components/schemas/DiagnosticAiReport'
        run_id:
          $ref: '#/components/schemas/Uuid'
        result_ref:
          type: string
    SubmitDiagnosticOptimizationOrderRequest:
      type: object
      additionalProperties: false
      required:
      - flow_id
      - ephemeral_run_id
      - title
      properties:
        flow_id:
          $ref: '#/components/schemas/Uuid'
        ephemeral_run_id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
          minLength: 1
          maxLength: 200
        remark:
          type:
          - string
          - 'null'
          maxLength: 4000
    SubmitDiagnosticOptimizationOrderResponse:
      type: object
      additionalProperties: false
      required:
      - report
      - order_id
      - order_display_no
      - order_state
      properties:
        report:
          $ref: '#/components/schemas/DiagnosticAiReport'
        order_id:
          $ref: '#/components/schemas/Uuid'
        order_display_no:
          type: string
        order_state:
          type: string
    EventStreamHandshake:
      type: object
      additionalProperties: false
      required:
      - status
      - transport
      properties:
        status:
          type: string
          enum:
          - ready
        transport:
          type: string
          enum:
          - sse
