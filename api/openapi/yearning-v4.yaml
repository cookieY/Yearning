                        $ref: '#/components/schemas/AiProviderRateVersion'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
    post:
      tags:
      - Administration
      operationId: createAiProviderRateVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAiProviderRateVersionRequest'
      responses:
        '200':
          description: >-
            Rate version created. Versions are append-only; editing means creating
            a new disjoint future version and historical snapshots are never
            rewritten. When the daily budget is enforced and the provider is
            enabled, the currency must match the budget currency.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
