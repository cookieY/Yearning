  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    FlowType:
      type: string
      enum:
      - change_review
      - query_access
    BusinessErrorCode:
      type: integer
      enum:
      - 1001
      - 1002
      - 1003
      - 1004
      - 1005
      - 1006
      - 1007
      - 1008
      - 1009
      - 1010
      - 1011
      - 1012
      - 1101
      - 1102
      - 1103
      - 1104
      - 1105
      - 1106
      - 1107
      - 1108
      - 1109
      - 2001
      - 2002
      - 2003
      - 2004
      - 2005
      - 2006
      - 2007
      - 2008
      - 2009
      - 2010
      - 2011
      - 2012
      - 2013
      - 2014
      - 3001
      - 3002
      - 3003
      - 3004
      - 3005
      - 3006
      - 3007
      - 3008
      - 3009
      - 3010
      - 3011
      - 3012
      - 4001
      - 4002
      - 4003
      - 4004
      - 4005
      - 4006
      - 4007
      - 4008
      - 4009
      - 4010
      - 4011
      - 5001
      - 5002
      - 5003
      - 5004
      - 5005
      - 6001
      - 6002
      - 6003
      - 6004
      - 6005
      - 6006
      - 6007
      - 7001
      - 7002
      - 7003
      - 7004
      - 7005
      - 7006
      - 7007
      - 7008
    Page:
      type: object
      required:
      - items
      - page
      properties:
        items:
          type: array
          items: {}
        page:
          $ref: '#/components/schemas/PageInfo'
    PageInfo:
      type: object
      additionalProperties: false
      required:
      - next_cursor
      - has_more
      properties:
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      - request_id
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        request_id:
          $ref: '#/components/schemas/Uuid'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 1024
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - display_name
      - password
      properties:
        username:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        email:
          type:
          - string
          - 'null'
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 1024
    User:
      type: object
      required:
      - id
      - username
      - is_builtin_admin
      - version
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        username:
          type: string
        display_name:
          type: string
        email:
          type:
          - string
          - 'null'
          format: email
        is_builtin_admin:
          type: boolean
        role:
          type: string
          enum:
          - user
          - admin
          default: user
          description: User account role. Both is_builtin_admin=true and role=admin grant access to /admin/* management pages.
        auth_provider:
          type: string
          enum:
          - local
          - ldap
          - oidc
          default: local
          description: Identity provider managing this user's password; only local non-builtin accounts allow admin password reset.
        version:
          type: integer
          minimum: 1
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    CurrentUser:
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        required:
        - can_access_admin
        properties:
          can_access_admin:
            type: boolean
          auth_provider:
            description: >-
              Where the account password is managed. local accounts may use
              the self-service password change; ldap/oidc accounts have their
              password managed by the identity source. Absent means local.
            type: string
            enum:
            - local
            - ldap
            - oidc
          system_timezone:
            description: >-
              Active platform display timezone configured under general
              settings (IANA timezone identifier, e.g. Asia/Shanghai or UTC).
            type: string
    ChangeMyPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - old_password
      - new_password
      properties:
        old_password:
          type: string
          minLength: 1
          maxLength: 1024
        new_password:
          type: string
          minLength: 12
          maxLength: 1024
    ResetUserPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - new_password
      properties:
        new_password:
          type: string
          minLength: 12
          maxLength: 1024
          format: password
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - display_name
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        email:
          type:
          - string
          - 'null'
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 1024
        role:
          type: string
          enum:
          - user
          - admin
          default: user
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        email:
          type:
          - string
          - 'null'
          format: email
        role:
          type: string
          enum:
          - user
          - admin
    UserDeletionImpact:
      type: object
      additionalProperties: false
      required:
      - user_id
      - can_delete
      - blockers
      - flow_actor_references
      - permission_group_memberships
      - active_query_grants
      - active_query_sessions
      - historical_snapshots_preserved
      - calculated_at
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        can_delete:
          type: boolean
        blockers:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - count
            properties:
              code:
                type: string
              count:
                type: integer
                minimum: 1
        flow_actor_references:
          type: integer
          minimum: 0
        permission_group_memberships:
          type: integer
          minimum: 0
        active_query_grants:
          type: integer
          minimum: 0
        active_query_sessions:
          type: integer
          minimum: 0
        historical_snapshots_preserved:
          type: boolean
          const: true
        calculated_at:
          $ref: '#/components/schemas/Timestamp'
    SecretInput:
      type: object
      additionalProperties: false
      required:
      - value
      properties:
        value:
          type: string
          minLength: 1
          writeOnly: true
    LegacyMigrationRunState:
      type: string
      enum: [planned, dry_run_running, awaiting_confirmation, approved, applying, verifying, verified, failed]
    LegacyMigrationTableResult:
      type: object
      additionalProperties: false
      required: [source_table, target_tables, read, written, excluded, quarantined, failed, reconciliation_passed]
      properties:
        source_table: {type: string}
        target_tables:
          type: array
          items: {type: string}
        read: {type: integer, format: int64, minimum: 0}
        written: {type: integer, format: int64, minimum: 0}
        excluded: {type: integer, format: int64, minimum: 0}
        quarantined: {type: integer, format: int64, minimum: 0}
        failed: {type: integer, format: int64, minimum: 0}
        reconciliation_passed: {type: boolean}
    LegacyMigrationCandidate:
      type: object
      additionalProperties: false
      required: [candidate_id, kind, source_refs, target_definition_hash, risk, coverage_added, coverage_missing, confirmed]
      properties:
        candidate_id: {$ref: '#/components/schemas/Uuid'}
        kind: {type: string, enum: [permission_group_flow_grant, single_stage_flow, multi_stage_flow, rule_set]}
        source_refs:
          type: array
          minItems: 1
          items: {type: string, maxLength: 512}
        target_definition_hash: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        risk: {type: string, enum: [no_expansion, possible_expansion, unmapped]}
        coverage_added:
          type: array
          items: {type: string, maxLength: 512}
        coverage_missing:
          type: array
          items: {type: string, maxLength: 512}
        confirmed: {type: boolean}
        confirmed_by: {type: [string, 'null'], enum: [admin, null]}
        confirmed_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
    LegacyMigrationRun:
      type: object
      additionalProperties: false
      required: [id, source_schema_version, manifest_hash, state, active_work_count, unknown_status_count, ambiguous_status_count, table_results, candidates, all_candidates_confirmed, version, started_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        source_schema_version: {type: string}
        manifest_hash: {type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$'}
        state: {$ref: '#/components/schemas/LegacyMigrationRunState'}
        active_work_count: {type: integer, format: int64, minimum: 0}
        unknown_status_count: {type: integer, format: int64, minimum: 0}
        ambiguous_status_count: {type: integer, format: int64, minimum: 0}
        table_results:
          type: array
          items: {$ref: '#/components/schemas/LegacyMigrationTableResult'}
        candidates:
          type: array
          items: {$ref: '#/components/schemas/LegacyMigrationCandidate'}
        all_candidates_confirmed: {type: boolean}
        approved_manifest_hash: {type: [string, 'null'], pattern: '^sha256:[0-9a-f]{64}$'}
        approved_by: {type: [string, 'null'], enum: [admin, null]}
        approved_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        version: {type: integer, minimum: 1}
        started_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        finished_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
    LegacyMigrationRunPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LegacyMigrationRun'}
        page: {$ref: '#/components/schemas/PageInfo'}
    ConfirmLegacyMigrationCandidateRequest:
      type: object
      additionalProperties: false
      required: [confirmed, target_definition_hash]
      properties:
        confirmed: {type: boolean}
        target_definition_hash: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        comment: {type: string, maxLength: 1000}
    ApproveLegacyMigrationRunRequest:
      type: object
      additionalProperties: false
      required: [manifest_hash, confirmation_phrase]
      properties:
        manifest_hash: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        confirmation_phrase:
          type: string
          minLength: 44
          maxLength: 80
          description: Must equal APPROVE followed by one ASCII space and the migration run UUID.
    LdapProviderConfiguration:
      type: object
      additionalProperties: false
      required: [host, port, transport, server_name, bind_dn, base_dn, user_filter, username_attribute, display_name_attribute, email_attribute, connect_timeout_ms, bind_timeout_ms, search_timeout_ms]
      properties:
        host: {type: string, minLength: 1, maxLength: 253}
        port: {type: integer, minimum: 1, maximum: 65535}
        transport: {type: string, enum: [ldaps, starttls]}
        server_name: {type: string, minLength: 1, maxLength: 253}
        bind_dn: {type: string, maxLength: 1024}
        base_dn: {type: string, minLength: 1, maxLength: 1024}
        user_filter:
          type: string
          minLength: 1
          maxLength: 1024
          description: Must contain exactly one literal {username} placeholder; the runtime substitutes an RFC 4515 escaped value only.
        username_attribute: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z][A-Za-z0-9;-]*$'}
        display_name_attribute: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z][A-Za-z0-9;-]*$'}
        email_attribute:
          type: [string, 'null']
          maxLength: 128
          pattern: '^[A-Za-z][A-Za-z0-9;-]*$'
        connect_timeout_ms: {type: integer, minimum: 100, maximum: 30000}
        bind_timeout_ms: {type: integer, minimum: 100, maximum: 30000}
