      operationId: submitChangeDraft
      description: >-
        Submit the ephemeral precheck result as an immutable workorder
        (RCP-20261101-EPHEMERAL-PRECHECK). The request carries the flow, the
        current SQL and the ephemeral run_id; the server verifies the SQL is
        byte-identical to what was prechecked, materializes the run in the
        submission transaction (the only persistence point for review
        content), and freezes the order. draft_id is omitted for direct
        create-mode submission; the draft is never modified by precheck and
        is only marked submitted here.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - flow_id
              - sql
              - run_id
              properties:
                flow_id:
                  $ref: '#/components/schemas/Uuid'
                draft_id:
                  $ref: '#/components/schemas/Uuid'
                sql:
                  type: string
                  description: SQL submitted verbatim; must equal the prechecked text.
                run_id:
                  $ref: '#/components/schemas/Uuid'
                target_database:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 128
                  description: Optional default database (MySQL-compatible stages) or Target Schema within the connected Database (PostgreSQL stages) bound during precheck; explicit null clears any saved draft override on submission.
                metadata:
                  type: object
                  additionalProperties: false
                  description: Required only for draftless create-mode submission.
                  properties:
                    title:
                      type: string
                      minLength: 1
                      maxLength: 128
                    description:
                      type: string
                      maxLength: 4096
                    requested_scheduled_for:
                      type: string
                      format: date-time
                    rollback_enabled:
                      type: boolean
                      default: true
      responses:
        '200':
          description: Immutable workorder snapshot created
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      $ref: '#/components/schemas/ChangeOrder'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
    get:
      tags:
      - Change orders
      operationId: listChangeOrders
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      - name: state
        in: query
        description: Exact-match filter on the aggregate order state.
        schema:
          $ref: '#/components/schemas/ChangeOrderState'
      - name: q
        in: query
        description: >-
          Case-insensitive keyword matched against display_number or title
          (Work ID and title search). Filters narrow the session-scoped
          result; they never widen authorization.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: datasource
        in: query
        description: Exact match against any stage datasource_name of the order.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: submitted_from
        in: query
        description: Inclusive lower bound on submitted_at (calendar day start in general.system_timezone).
        schema:
          type: string
          format: date
      - name: submitted_to
        in: query
        description: Inclusive upper bound on submitted_at (calendar day end in general.system_timezone).
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Business result
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - err_code
                  - message
                  - data
                  - request_id
                  properties:
                    err_code:
                      type: integer
                      const: 0
                    message:
                      type: string
                      const: ok
                    data:
                      allOf:
                      - $ref: '#/components/schemas/Page'
                      - type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/ChangeOrder'
                    request_id:
                      $ref: '#/components/schemas/Uuid'
                - $ref: '#/components/schemas/BusinessErrorResponse'
