      - Administration
      operationId: listDatasources
      parameters:
      - name: q
        in: query
        description: >-
          Case-insensitive substring matched against the datasource name or host
          (admin list server-side search, migration contract §18.73). Composes
          with the cursor walk; never widens authorization.
        schema:
          type: string
      - name: engine
        in: query
        description: >-
          Narrows the admin datasource list by engine (exact enum match).
          AND-composes with q, the other column filters and the cursor walk; an
          unknown value is rejected with 1001; omitted keeps the unfiltered list.
        schema:
          type: string
          enum:
          - mysql
          - postgresql
          - tidb
          - oceanbase
          - polardb
      - name: compatibility_mode
        in: query
        description: >-
          Narrows the admin datasource list by compatibility mode (exact enum
          match). AND-composes with q, the other column filters and the cursor
          walk; an unknown value is rejected with 1001; omitted keeps the
          unfiltered list.
        schema:
          type: string
          enum:
          - mysql
          - postgresql
      - name: credential_mode
        in: query
        description: >-
          Narrows the admin datasource list by whether an enabled execution-purpose
          credential is stored: read_write means present, read_only means absent.
          Presence only — never exposes credential material. AND-composes with q,
          the other column filters and the cursor walk; an unknown value is
          rejected with 1001; omitted keeps the unfiltered list.
        schema:
          type: string
          enum:
          - read_write
          - read_only
      - name: referenced
        in: query
        description: >-
          Narrows the admin datasource list to rows referenced (true) or not
          referenced (false) by at least one flow stage. AND-composes with q, the
          other column filters and the cursor walk; an unparsable value is rejected
          with 1001; omitted keeps the unfiltered list.
        schema:
          type: boolean
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Business result
          content:
            application/json:
              schema:
