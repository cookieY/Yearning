components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: yearning_session
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    After:
      name: after
      in: query
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^\"[1-9][0-9]*\"$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[\x21-\x7E]+$
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    FlowId:
      name: flow_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DatasourceId:
      name: datasource_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PermissionGroupId:
      name: group_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RuleSetId:
      name: rule_set_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PromptToolId:
      name: prompt_tool_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    KnowledgeEntryId:
      name: knowledge_entry_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AiProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdentityProviderId:
      name: identity_provider_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    MigrationRunId:
      name: migration_run_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    MigrationCandidateId:
      name: candidate_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    NotificationChannelId:
      name: channel_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    NotificationRuleId:
      name: rule_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SettingsNamespaceName:
      name: namespace
      in: path
      required: true
      schema:
        type: string
        enum:
        - general
        - query
        - execution
        - ai-budget
        - branding
    DatasourceIdQuery:
      name: datasource_id
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SchemaNameQuery:
      name: schema_name
      in: query
      required: true
      schema:
